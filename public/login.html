<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Owner Login - Chunari POS</title>
<link rel="stylesheet" href="/css/style.css" />
<style>
  body { padding-bottom: 24px; }
  .login-wrap { min-height: 92vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
  .login-card { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 30px 26px; }
  .login-mark { width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(145deg, var(--primary), var(--primary-dark)); box-shadow: var(--shadow-glow); display: flex; align-items: center; justify-content: center; color: #fff8f0; font-family: var(--font-display); font-weight: 700; font-size: 24px; margin: 0 auto 16px; }
  .login-title { text-align: center; font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .login-sub { text-align: center; color: var(--ink-faint); font-size: 13px; margin-bottom: 24px; }
  .pin-input { text-align: center; font-size: 26px; letter-spacing: 0.4em; font-weight: 700; }
</style>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-mark">C</div>
    <div class="login-title">Owner Login</div>
    <div class="login-sub">Enter your passcode to manage products, billing and reports.</div>

    <form id="form">
      <div class="field">
        <label id="pcLabel"></label>
        <input type="password" inputmode="numeric" id="passcode" class="pin-input" placeholder="••••" autofocus />
      </div>
      <button class="btn" type="submit" id="loginBtn"></button>
    </form>

    <a class="btn ghost" href="/shop.html" id="customerLink" style="margin-top:12px;"></a>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/common.js"></script>
<script>
  document.getElementById('pcLabel').innerHTML = icon('lock', 14) + ' Passcode';
  document.getElementById('loginBtn').innerHTML = icon('check', 18) + 'Login';
  document.getElementById('customerLink').innerHTML = icon('store', 17) + 'Continue browsing as customer';

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const passcode = document.getElementById('passcode').value.trim();
    if (!passcode) return;
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    try {
      await apiSend('/api/auth/login', 'POST', { passcode });
      const params = new URLSearchParams(location.search);
      location.href = params.get('next') || '/index.html';
    } catch (err) {
      toast(err.message, true);
      document.getElementById('passcode').value = '';
      btn.disabled = false;
    }
  });
</script>
